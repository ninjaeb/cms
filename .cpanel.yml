---
# cPanel Git Version Control deployment tasks.
# Repository path == the Node.js App's Application Root for this site, so no
# file copy step is needed — build/deploy commands run in place. Each task
# line is fully self-contained (sources the nodevenv and cd's into the app
# root itself) rather than relying on state from earlier lines, since that
# is not guaranteed across all cPanel versions.
#
# npm ci (not npm install) is used deliberately: it installs exactly what
# package-lock.json specifies and never silently reconciles drift, unlike
# npm install which can leave a stale/mismatched package installed if
# node_modules was touched by an earlier partial/manual install attempt.
#
# --ignore-scripts: in this non-interactive deploy context, npm's postinstall
# hook (which runs `prisma generate`) has been observed spawning its child
# process with the wrong working directory, even though an interactive shell
# in the same activated nodevenv resolves paths correctly. Working around it
# by disabling lifecycle scripts here and calling `prisma generate`/
# `migrate deploy` explicitly below, each with an absolute --schema path so
# there's no cwd ambiguity left to get wrong.
#
# Update the paths below if the cPanel username, domain, or Node.js version
# selected in "Setup Node.js App" ever changes.
#
# The build step sets NODE_OPTIONS explicitly: an interactive shell on this
# host has --max-old-space-size=2048 set (likely via ~/.bashrc), giving V8 a
# ~2.2GB heap. cPanel's non-interactive deploy task runner does not source
# that file, so without setting it here V8 falls back to an auto-detected
# heap of only ~30-60MB on this host/container, and `next build` reliably
# dies with "JavaScript heap out of memory" a few hundred ms in.
#
# The build is also retried up to 3 times, each separated by a sleep: this
# host is shared and its free memory fluctuates, so even the single-worker
# build (see next.config.ts's experimental.cpus) can fail an allocation
# outright during a low-memory moment on the host, independent of anything
# this app controls. Immediate back-to-back retries were observed to all
# fail within the same ~8 second window (the shortage outlasted a bare
# retry), so each retry now waits 30s first to give the host a real chance
# to free memory before trying again.
deployment:
  tasks:
    - source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && npm ci --include=dev --ignore-scripts
    - source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && npx prisma generate --schema=/home/gotka7/cms.gotka.com/prisma/schema.prisma
    - source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && npx prisma migrate deploy --schema=/home/gotka7/cms.gotka.com/prisma/schema.prisma
    - source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && NODE_OPTIONS="--max-old-space-size=2048" npm run build || (sleep 30 && source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && NODE_OPTIONS="--max-old-space-size=2048" npm run build) || (sleep 30 && source /home/gotka7/nodevenv/cms.gotka.com/24/bin/activate && cd /home/gotka7/cms.gotka.com && NODE_OPTIONS="--max-old-space-size=2048" npm run build)
    - mkdir -p /home/gotka7/cms.gotka.com/tmp && touch /home/gotka7/cms.gotka.com/tmp/restart.txt
